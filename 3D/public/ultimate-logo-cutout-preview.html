<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Ultimate logo cutout</title>
  <style>
    html, body { margin: 0; min-height: 100%; display: flex; align-items: center; justify-content: center; }
    body {
      background-color: #fff;
      background-image:
        linear-gradient(45deg, #e8e8e8 25%, transparent 25%),
        linear-gradient(-45deg, #e8e8e8 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #e8e8e8 75%),
        linear-gradient(-45deg, transparent 75%, #e8e8e8 75%);
      background-size: 24px 24px;
      background-position: 0 0, 0 12px, 12px -12px, -12px 0;
    }
    img { width: min(720px, 92vw); height: auto; }
  </style>
</head>
<body>
  <img src="./ultimate-logo-cutout.png" alt="Ultimate logo cutout" />
</body>
</html>
