<!doctype html>
<html><body style="margin:0"><pre id="out" style="position:absolute;font-size:10px">loading</pre>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from "three";
import { FBXLoader } from "three/addons/loaders/FBXLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
const params = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(900, 900);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color("#ece8e1");
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(renderer), 0.03).texture;
const light = new THREE.DirectionalLight("#fff", 2);
light.position.set(1, 3, 3);
scene.add(light);
const manager = new THREE.LoadingManager();
manager.setURLModifier((url) => (/\.(tga|png|jpg)$/i.test(url) ? url.replace(/\.tga$/i, ".jpg").replace(/^.*[\\/]/, params.get("tex") + "/") : url));
const obj = await new FBXLoader(manager).loadAsync(params.get("m"));
const texLoader = new THREE.TextureLoader();
const tex = params.get("tex");
const load = (n, srgb) => texLoader.loadAsync(`${tex}/${n}.jpg`).then((t) => { if (srgb) t.colorSpace = THREE.SRGBColorSpace; return t; });
const jobs = [];
obj.traverse((o) => {
  if (!o.isMesh) return;
  o.material = [].concat(o.material).map((m) => {
    const base = m.name;
    const s = new THREE.MeshStandardMaterial({ name: base, roughness: 0.75 });
    jobs.push(load(`${base}_color`, true).then((t) => (s.map = t)), load(`${base}_normal`).then((t) => (s.normalMap = t)));
    return s;
  });
});
await Promise.all(jobs);
const islandInfo = [];
if (params.get("nohelmet")) obj.traverse((o) => { if (o.isMesh) o.material.forEach((m) => { if (/helmet/.test(m.name)) m.visible = false; }); });
if (params.get("hide")) {
  obj.traverse((o) => {
    if (!o.isMesh) return;
    const g = o.geometry;
    const pos = g.attributes.position;
    const uv = g.attributes.uv;
    const img = o.material[0].map.image;
    const cv = document.createElement("canvas");
    cv.width = 512; cv.height = 512;
    const ctx = cv.getContext("2d");
    ctx.drawImage(img, 0, 0, 512, 512);
    const px = ctx.getImageData(0, 0, 512, 512).data;
    const n = pos.count;
    const parent = Int32Array.from({ length: n }, (_, i) => i);
    const find = (a) => { while (parent[a] !== a) a = parent[a] = parent[parent[a]]; return a; };
    const key = new Map();
    for (let i = 0; i < n; i++) {
      const k = `${pos.getX(i).toFixed(3)},${pos.getY(i).toFixed(3)},${pos.getZ(i).toFixed(3)}`;
      if (key.has(k)) parent[find(i)] = find(key.get(k)); else key.set(k, i);
    }
    for (let i = 0; i < n; i += 3) { parent[find(i + 1)] = find(i); parent[find(i + 2)] = find(i); }
    const matOf = new Int32Array(n);
    for (const gr of g.groups) for (let i = gr.start; i < gr.start + gr.count; i++) matOf[i] = gr.materialIndex;
    const stats = new Map();
    for (let i = 0; i < n; i += 3) {
      const r = find(i);
      const s = stats.get(r) || { tris: 0, yellow: 0, mat: matOf[i], min: [1e9, 1e9, 1e9], max: [-1e9, -1e9, -1e9] };
      s.tris++;
      if (matOf[i] === 0) {
        const u = (uv.getX(i) + uv.getX(i + 1) + uv.getX(i + 2)) / 3, v = (uv.getY(i) + uv.getY(i + 1) + uv.getY(i + 2)) / 3;
        const x = Math.min(511, Math.max(0, Math.floor(u * 512))), y = Math.min(511, Math.max(0, Math.floor((1 - v) * 512)));
        const j = (y * 512 + x) * 4;
        const R = px[j], G = px[j + 1], B = px[j + 2];
        if (R > 150 && G > 130 && B < 120) s.yellow++;
      }
      for (let k = 0; k < 3; k++) { s.min[k] = Math.min(s.min[k], pos.getComponent(i, k)); s.max[k] = Math.max(s.max[k], pos.getComponent(i, k)); }
      stats.set(r, s);
    }
    const hide = new Set();
    for (const [r, s] of stats) {
      islandInfo.push(`${s.tris} m${s.mat} y${(s.yellow / s.tris).toFixed(2)} [${s.min.map((v) => v.toFixed(0))}] [${s.max.map((v) => v.toFixed(0))}]`);
      if (s.yellow / s.tris > 0.3) hide.add(r);
    }
    for (const gr of g.groups) gr.count = gr.count;
    const keep = [];
    for (let i = 0; i < n; i += 3) if (!hide.has(find(i))) keep.push(i, i + 1, i + 2);
    const newGroups = [];
    let start = 0;
    const kept = [];
    for (const gr of g.groups) {
      const tri = [];
      for (let i = gr.start; i < gr.start + gr.count; i += 3) if (!hide.has(find(i))) tri.push(i, i + 1, i + 2);
      newGroups.push({ start: kept.length, count: tri.length, materialIndex: gr.materialIndex });
      kept.push(...tri);
    }
    g.setIndex(kept);
    g.clearGroups();
    for (const gr of newGroups) g.addGroup(gr.start, gr.count, gr.materialIndex);
  });
}
scene.add(obj);
obj.updateMatrixWorld(true);
const info = { meshes: [], bones: [] };
obj.traverse((o) => {
  if (o.isMesh) {
    const mats = [].concat(o.material);
    info.meshes.push({ name: o.name, skinned: !!o.isSkinnedMesh, verts: o.geometry.attributes.position.count, groups: o.geometry.groups.map((g) => `${g.start}+${g.count}:m${g.materialIndex}`), mats: mats.map((m) => `${m.name}:${m.type}:${m.map?.name || m.map?.image?.src?.split("/").pop()}`), ws: o.getWorldScale(new THREE.Vector3()).toArray().map((v) => v.toFixed(3)) });
  }
  if (o.isBone && info.bones.length < 70) info.bones.push(o.name);
});
const box = new THREE.Box3().setFromObject(obj);
info.min = box.min.toArray().map((v) => v.toFixed(2));
info.max = box.max.toArray().map((v) => v.toFixed(2));
info.anims = obj.animations.map((a) => a.name);
info.islands = islandInfo.sort((a, b) => parseInt(b) - parseInt(a)).slice(0, 40);
const size = box.getSize(new THREE.Vector3());
const c = box.getCenter(new THREE.Vector3());
const cam = new THREE.PerspectiveCamera(30, 1, size.y * 0.01, size.y * 20);
const focus = params.get("head") ? new THREE.Vector3(c.x, box.max.y - size.y * 0.07, c.z) : c;
cam.position.set(focus.x + (params.get("head") ? size.y * 0.25 : 0), focus.y, focus.z + size.y * (params.get("head") ? 0.45 : 2.2));
cam.lookAt(focus);
renderer.render(scene, cam);
window.__shot = renderer.domElement.toDataURL("image/png");
document.getElementById("out").textContent = JSON.stringify(info, null, 1);
window.__done = true;
</script></body></html>
