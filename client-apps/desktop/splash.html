<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UltiTech ERP</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(145deg, #0f172a 0%, #1e293b 45%, #0f172a 100%);
      user-select: none;
      -webkit-user-select: none;
    }
    .wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 2rem;
      gap: 1.5rem;
    }
    .logo {
      width: 180px;
      height: auto;
      filter: drop-shadow(0 8px 28px rgba(56, 189, 248, 0.25));
    }
    .loader {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(148, 163, 184, 0.25);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="./assets/logo.png" width="180" height="180" alt="" />
    <div class="loader" role="status" aria-label="Loading"></div>
  </div>
</body>
</html>
