<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UltiTech ERP</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(160deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      user-select: none;
      -webkit-user-select: none;
    }
    .wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 2.5rem;
      gap: 2rem;
      animation: fade-in 0.45s ease-out;
    }
    .logo {
      width: 220px;
      height: 220px;
      object-fit: contain;
      filter: drop-shadow(0 10px 32px rgba(56, 189, 248, 0.3));
      animation: logo-pop 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .loader {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(148, 163, 184, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes logo-pop {
      from { opacity: 0; transform: scale(0.88); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="./assets/logo.png" width="220" height="220" alt="UltiTech ERP" />
    <div class="loader" role="status" aria-label="Loading"></div>
  </div>
</body>
</html>
